<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Table Structure</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>Table</h1>

    <table>
        <thead>
            <tr> 
                <th>Name</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alex</td>
                <td>Developer</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
